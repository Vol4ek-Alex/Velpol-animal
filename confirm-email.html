<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение Email</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }
        .icon { font-size: 4rem; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 16px; font-weight: 700; }
        p { color: #cbd5e1; margin-bottom: 12px; line-height: 1.6; }
        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            margin: 20px 0;
        }
        .status.success { background: rgba(52, 211, 153, 0.1); border: 1px solid #34d399; color: #34d399; }
        .status.error { background: rgba(251, 113, 133, 0.1); border: 1px solid #fb7185; color: #fb7185; }
        .status.pending { background: rgba(251, 191, 36, 0.1); border: 1px solid #fbbf24; color: #fbbf24; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #34d399);
            border: none;
            border-radius: 12px;
            padding: 14px 32px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            margin-top: 20px;
            cursor: pointer;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #34d399;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Проверяем подтверждение...</p>
        </div>
        <div id="success" class="hidden">
            <div class="icon">✅</div>
            <h1>Email подтверждён!</h1>
            <div class="status pending">⏳ Ожидает одобрения администратора</div>
            <p>Заявка отправлена на одобрение. Вы получите уведомление после решения администратора.</p>
            <a href="/index.html" class="btn">На главную</a>
        </div>
        <div id="error" class="hidden">
            <div class="icon">❌</div>
            <h1>Ошибка подтверждения</h1>
            <div class="status error">Что-то пошло не так</div>
            <p id="error-message">Попробуйте еще раз.</p>
            <a href="/index.html" class="btn">На главную</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        document.getElementById('loading').classList.remove('hidden');
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');
        }, 1500);
    </script>
</body>
</html>
