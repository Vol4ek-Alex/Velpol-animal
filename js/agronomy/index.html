<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1728">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Контроль•Агрономия</title>
    <link rel="manifest" href="../../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-atmospheric" aria-hidden="true"></div>

    <header class="mobile-header">
        <button type="button" class="menu-btn" onclick="toggleMenu()" aria-label="Открыть меню">☰ Меню</button>
        <span style="color:#fff;font-size:.9rem;font-weight:800;">Контроль•Агрономия</span>
    </header>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <button id="floating-editor-btn" class="floating-editor-btn" type="button" onclick="toggleEditMode()">
        <span id="editor-btn-icon">🔒</span>
        <span id="editor-btn-text">Просмотр</span>
    </button>

    <div class="app-layout">
        <nav id="sidebar" class="glass-panel" aria-label="Главное меню">
            <div class="brand-box">
                <div class="brand-logo">🌾</div>
                <div class="brand-content">
                    <div class="brand-title">Контроль•Агрономия</div>
                    <div class="brand-subtitle">Поля &amp; Культуры</div>
                </div>
            </div>

            <ul class="menu-list">
                <li class="menu-item active" data-page="dashboard">
                    <span>📊</span> Дашборд
                </li>
                <li class="menu-item" data-page="fields">
                    <span>🗺️</span> Поля
                </li>
                <li class="menu-item" data-page="crops">
                    <span>🌱</span> Культуры
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-user" id="sidebar-user" hidden>
                    <div class="sidebar-user-avatar"><span id="sidebar-user-initials">?</span></div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebar-user-name">Пользователь</div>
                        <div class="sidebar-user-role" id="sidebar-user-role">Гость</div>
                    </div>
                </div>

                <button type="button" id="sidebar-logout-button" class="glass-btn auth-logout-button">
                    <span>↪</span> Выйти
                </button>
            </div>
        </nav>

        <main id="main-content"></main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/modules/common.js"></script>
    <script src="modules/auth.js"></script>
    <script src="modules/dashboard.js"></script>
    <script src="modules/fields.js"></script>
    <script src="modules/crops.js"></script>
    <script src="app.js"></script>
</body>
</html>
