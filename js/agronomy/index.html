<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1728">
    <title>Агрономия • В разработке</title>
    <link rel="manifest" href="../../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
        }
        .icon {
            font-size: 6rem;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            margin: 0 0 16px;
        }
        p {
            font-size: 1.2rem;
            color: var(--muted);
            margin: 0 0 32px;
        }
        .btn-back {
            padding: 14px 32px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--green-dark), var(--green));
            border: none;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52, 211, 153, 0.3);
        }
    </style>
</head>
<body>
    <div class="bg-atmospheric"></div>
    <div class="container">
        <div class="icon">🌾</div>
        <h1>Модуль Агрономии</h1>
        <p>Данный модуль находится в разработке. Скоро здесь будет доступно управление посевами, полями, культурами и статистикой по гектарам.</p>
        <button class="btn-back" onclick="window.location.href='../../'">← Вернуться к выбору модуля</button>
    </div>
</body>
</html>
