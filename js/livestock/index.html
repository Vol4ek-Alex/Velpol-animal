<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b1728">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Контроль•животноводство</title>

    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../../assets/icon.svg">
    <link rel="apple-touch-icon" href="../../assets/icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            color-scheme: dark;

            --page-bg: #091728;
            --page-bg-deep: #060e1b;

            --glass: rgba(20, 39, 64, 0.68);
            --glass-strong: rgba(14, 30, 51, 0.96);
            --input-bg: rgba(3, 10, 20, 0.58);

            --line: rgba(255, 255, 255, 0.15);
            --line-bright: rgba(255, 255, 255, 0.28);
            --line-green: rgba(52, 211, 153, 0.48);

            --text: #f5f7fb;
            --muted: #a8b6c9;
            --subtle: #78879b;

            --green: #34d399;
            --green-dark: #10b981;
            --blue: #7dd3fc;
            --amber: #fbbf24;
            --red: #fb7185;

            --card-radius: 20px;
            --sidebar-width: 280px;

            --shadow:
                0 16px 44px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: var(--page-bg-deep);
        }

        body {
            position: relative;
            isolation: isolate;
            width: 100%;
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow-x: hidden;
            color: var(--text);
            background: var(--page-bg);
            font-family: "Exo 2", sans-serif;
            font-size: 15px;
            line-height: 1.4;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            color: inherit;
        }

        /*
         * Фоновая фотография.
         * Файл: assets/bg-farm.jpg
         */
        .bg-atmospheric {
            position: fixed;
            inset: -24px;
            z-index: -3;
            pointer-events: none;
            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 31, 0.1),
                    rgba(4, 11, 22, 0.3)
                ),
                url("../../assets/bg-farm.jpg") center center / cover no-repeat;
            filter: blur(14px) brightness(0.9) saturate(1.08);
        }

        .bg-atmospheric::after {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(5, 13, 25, 0.1) 0%,
                    rgba(5, 14, 27, 0.06) 45%,
                    rgba(3, 9, 18, 0.34) 100%
                ),
                radial-gradient(
                    ellipse at center,
                    rgba(8, 20, 36, 0.02),
                    rgba(3, 8, 16, 0.26)
                );
            content: "";
        }

        .app-layout {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 20px;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 14px;
        }

        .glass-panel {
            position: relative;
            min-width: 0;
            border: 1px solid var(--line);
            border-top-color: rgba(255, 255, 255, 0.3);
            border-radius: var(--card-radius);
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.018) 42%,
                    transparent
                ),
                var(--glass);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px) saturate(135%);
            -webkit-backdrop-filter: blur(18px) saturate(135%);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        #sidebar {
            position: sticky;
            top: 14px;
            z-index: 100;
            display: flex;
            flex: 0 0 var(--sidebar-width);
            flex-direction: column;
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: calc(100vh - 28px);
            height: calc(100dvh - 28px);
            padding: 20px;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.09),
                    transparent 44%
                ),
                rgba(14, 30, 51, 0.78);
        }

        .brand-box {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            width: 100%;
            min-width: 0;
            margin-bottom: 20px;
            padding-bottom: 17px;
            border-bottom: 1px solid var(--line);
        }

        .brand-logo {
            display: flex;
            flex: 0 0 42px;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            background: linear-gradient(135deg, #34d399, #047857);
            box-shadow:
                0 8px 24px rgba(16, 185, 129, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
        }

        .brand-content {
            flex: 1 1 auto;
            min-width: 0;
            padding-top: 1px;
        }

        .brand-title {
            display: block;
            width: 100%;
            max-width: 175px;
            overflow-wrap: anywhere;
            color: #fff;
            font-size: 0.98rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.035em;
        }

        .brand-subtitle {
            display: block;
            margin-top: 5px;
            color: var(--green);
            font-size: 0.64rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            flex: 0 1 auto;
            gap: 6px;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .sidebar-footer {
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .sidebar-footer .auth-logout-button {
            width: 100%;
            min-height: 42px;
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            min-height: 44px;
            padding: 10px 13px;
            border: 1px solid transparent;
            border-radius: 14px;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 600;
            transition:
                color 150ms ease,
                background-color 150ms ease,
                border-color 150ms ease,
                transform 150ms ease;
        }

        .menu-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(3px);
        }

        .menu-item.active {
            border-color: var(--line-green);
            color: #fff;
            background: rgba(16, 185, 129, 0.17);
        }

        .menu-item.active::before {
            position: absolute;
            top: 20%;
            bottom: 20%;
            left: 0;
            width: 3px;
            border-radius: 0 4px 4px 0;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
            content: "";
        }

        #main-content {
            flex: 1 1 auto;
            width: 100%;
            min-width: 0;
            padding-bottom: 125px;
            animation: none !important;
            transition: none !important;
        }

        #main-content.module-loading,
        #main-content.module-loaded {
            opacity: 1 !important;
            animation: none !important;
            transition: none !important;
        }

        .mobile-header {
            display: none;
        }

        .mobile-menu-icon {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 42px;
            min-height: 42px;
            padding: 0;
            border: 1px solid var(--line-bright);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            cursor: pointer;
            transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
        }

        .mobile-menu-icon span {
            display: block;
            width: 20px;
            height: 2px;
            border-radius: 2px;
            background: #fff;
            transition: transform 240ms ease, opacity 180ms ease;
        }

        .mobile-menu-icon[aria-expanded="true"] {
            border-color: var(--line-green);
            background: rgba(16, 185, 129, 0.18);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .mobile-menu-icon:active {
            transform: scale(0.94);
        }

        @keyframes panel-in {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body:not(.app-booted) .glass-panel,
        body:not(.app-booted) .stat-card {
            animation: panel-in 320ms ease both;
        }

        body:not(.app-booted) #main-content > div:first-child > .stat-card,
        body:not(.app-booted) #main-content > div:first-child > .glass-panel {
            animation-delay: 40ms;
        }

        .menu-btn {
            min-height: 38px;
            padding: 7px 12px;
            border: 1px solid var(--line-bright);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .floating-editor-btn {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 998;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 9px 15px;
            border: 1px solid var(--line-bright);
            border-radius: 999px;
            background: rgba(15, 31, 52, 0.92);
            color: var(--text);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(13px);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .floating-editor-btn.active {
            border-color: rgba(251, 191, 36, 0.78);
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1c1607;
        }

        body.edit-mode-active .edit-field {
            border-color: var(--amber) !important;
            background: rgba(245, 158, 11, 0.18) !important;
            color: #fff !important;
        }

        /*
         * Верхние карточки имеют постоянную высоту.
         * Изменение данных не двигает нижний контент.
         */
        #main-content [style*="grid-template-columns"] {
            align-items: stretch !important;
            grid-auto-rows: 138px !important;
        }

        #main-content [style*="grid-template-columns"] > .stat-card,
        #main-content [style*="grid-template-columns"] > .glass-panel {
            height: 138px !important;
            min-height: 138px !important;
            max-height: 138px !important;
            overflow: hidden !important;
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            gap: 5px;
            padding: 18px !important;
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 22px;
            color: var(--muted);
            font-size: 0.79rem;
            font-weight: 600;
        }

        .stat-value {
            min-height: 38px;
            color: #fff;
            font-family: "JetBrains Mono", monospace;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.06em;
            line-height: 1.1;
            white-space: nowrap;
        }

        .stat-unit {
            color: var(--muted);
            font-family: "Exo 2", sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0;
        }

        .badge,
        .badge-green,
        .badge-red {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: fit-content !important;
            min-height: 23px;
            padding: 4px 10px !important;
            border-radius: 999px !important;
            white-space: nowrap !important;
            line-height: 1.15;
        }

        .badge-green {
            border: 1px solid rgba(52, 211, 153, 0.4) !important;
            background: rgba(16, 185, 129, 0.18) !important;
            color: #6ee7b7 !important;
        }

        .badge-red {
            border: 1px solid rgba(251, 113, 133, 0.4) !important;
            background: rgba(244, 63, 94, 0.18) !important;
            color: #fda4af !important;
        }

        .farm-selector-wrapper {
            display: flex;
            gap: 5px;
            max-width: 100%;
            padding: 4px;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: rgba(9, 22, 39, 0.55);
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .farm-selector-wrapper::-webkit-scrollbar {
            display: none;
        }

        .farm-btn {
            flex: 0 0 auto;
            min-height: 34px;
            padding: 7px 12px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.77rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .farm-btn:hover,
        .farm-btn.active {
            border-color: rgba(255, 255, 255, 0.23);
            background: rgba(255, 255, 255, 0.13);
            color: #fff;
        }

        .table-responsive {
            width: 100%;
            max-width: 100%;
            margin-top: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior-x: contain;
            -webkit-overflow-scrolling: touch;
        }

        .glass-table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            table-layout: fixed;
            text-align: left;
        }

        .glass-table th,
        .glass-table td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .glass-table th {
            padding: 12px 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.045em;
            text-transform: uppercase;
        }

        .glass-table td {
            padding: 12px 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.84rem;
            vertical-align: middle;
        }

        .glass-table tr:hover td {
            background: rgba(255, 255, 255, 0.025);
        }

        .glass-table input[type="number"] {
            width: 90px !important;
            max-width: 100%;
            min-height: 32px;
            padding: 5px 8px !important;
            border-radius: 8px !important;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.8rem !important;
        }

        .glass-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 40px;
            padding: 9px 14px;
            border: 1px solid var(--line-bright);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition:
                border-color 160ms ease,
                background-color 160ms ease,
                box-shadow 160ms ease,
                transform 160ms ease;
        }

        .glass-btn:hover {
            border-color: rgba(255, 255, 255, 0.32);
            background: rgba(255, 255, 255, 0.12);
        }

        .glass-btn:active {
            transform: scale(0.97);
        }

        .glass-btn:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
            background: rgba(3, 8, 16, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 480px;
            max-height: calc(100dvh - 32px);
            padding: 22px;
            overflow-y: auto;
            border: 1px solid var(--line-bright);
            border-radius: 22px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.08),
                    transparent 44%
                ),
                rgba(15, 31, 52, 0.97);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.58);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .modal-input {
            width: 100%;
            min-height: 44px;
            padding: 10px 13px;
            outline: none;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--input-bg);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
        }

        .modal-input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
        }

        .app-error {
            max-width: 620px;
            margin: 30px auto;
            padding: 28px;
            text-align: center;
        }

        .app-error-icon {
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .app-error h2 {
            margin: 0 0 10px;
            font-size: 1.15rem;
        }

        .app-error p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.5;
        }

        #sidebar-backdrop {
            display: none;
        }

        @media (max-width: 1100px) and (min-width: 701px) {
            :root {
                --sidebar-width: 235px;
            }

            .app-layout {
                gap: 12px;
                padding: 10px;
            }

            #sidebar {
                padding: 16px;
            }

            .brand-title {
                font-size: 0.88rem;
            }

            .glass-table {
                min-width: 580px;
            }
        }

        @media (max-width: 700px) {
            html,
            body {
                width: 100%;
                min-width: 0;
                overflow-x: hidden;
            }

            body {
                background: #0b192b;
                font-size: 14px;
            }

            .bg-atmospheric {
                inset: -10px;
                filter: blur(9px) brightness(0.92) saturate(1.06);
            }

            .app-layout {
                display: block;
                width: 100%;
                min-height: 100dvh;
                padding: 0 10px;
            }

            .mobile-header {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 1200;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                width: 100%;
                min-height: calc(54px + env(safe-area-inset-top));
                padding:
                    env(safe-area-inset-top)
                    12px
                    0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                background: rgba(11, 24, 42, 0.42);
                backdrop-filter: blur(16px) saturate(1.2);
                -webkit-backdrop-filter: blur(16px) saturate(1.2);
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
            }

            .mobile-header .mobile-header-title {
                overflow: hidden;
                color: #ffffff;
                font-size: 0.86rem;
                font-weight: 800;
                letter-spacing: -0.01em;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /*
             * Меню находится выше backdrop.
             * Затемнение не блокирует клики внутри меню.
             */
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 1400;
                display: flex;
                width: min(300px, 88vw);
                min-width: 0;
                height: 100dvh;
                padding:
                    calc(20px + env(safe-area-inset-top))
                    18px
                    20px;
                overflow-y: auto;
                border-radius: 0 20px 20px 0;
                background:
                    linear-gradient(
                        145deg,
                        rgba(255, 255, 255, 0.08),
                        transparent 44%
                    ),
                    var(--glass-strong);
                box-shadow: 16px 0 45px rgba(0, 0, 0, 0.48);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                transform: translateX(-105%);
                transition: transform 230ms ease;
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #sidebar-backdrop {
                position: fixed;
                inset: 0;
                z-index: 1300;
                display: block;
                background: rgba(0, 0, 0, 0.58);
                opacity: 0;
                pointer-events: none;
                transition: opacity 180ms ease;
            }

            #sidebar-backdrop.open {
                opacity: 1;
                pointer-events: auto;
            }

            body.menu-open {
                overflow: hidden;
            }

            .brand-title {
                max-width: 210px;
                font-size: 0.98rem;
                line-height: 1.05;
            }

            .mobile-header .menu-btn {
                position: relative;
                z-index: 1500;
            }

            #main-content {
                width: 100%;
                min-width: 0;
                margin-top: calc(54px + env(safe-area-inset-top));
                padding: 12px 0 125px;
            }

            #main-content h1 {
                font-size: 1.28rem !important;
                line-height: 1.2 !important;
            }

            #main-content h3 {
                font-size: 0.98rem !important;
            }

            #main-content > div:first-child {
                display: flex !important;
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 12px !important;
                width: 100% !important;
                margin-bottom: 15px !important;
            }

            #main-content > div:first-child > div {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;
            }

            #farm-selector-container {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;
            }

            .farm-selector-wrapper {
                width: 100%;
                min-height: 44px;
                padding: 5px;
                border-radius: 13px;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            .farm-btn {
                min-height: 34px;
                padding: 7px 10px;
                font-size: 0.72rem;
            }

            #main-content [style*="grid-template-columns"] {
                display: grid !important;
                grid-template-columns: minmax(0, 1fr) !important;
                grid-auto-rows: 122px !important;
                gap: 10px !important;
                width: 100% !important;
            }

            #main-content [style*="grid-template-columns"] > .stat-card,
            #main-content [style*="grid-template-columns"] > .glass-panel {
                width: 100% !important;
                height: 122px !important;
                min-height: 122px !important;
                max-height: 122px !important;
            }

            .stat-card {
                padding: 15px !important;
                border-radius: 17px;
            }

            .stat-value {
                min-height: 32px;
                font-size: 1.45rem !important;
            }

            #main-content > .glass-panel,
            #main-content .glass-panel {
                max-width: 100%;
                border-radius: 17px;
            }

            #main-content > .glass-panel,
            #main-content > div > .glass-panel {
                padding: 14px !important;
            }

            .table-responsive {
                width: 100% !important;
                max-width: 100% !important;
                margin-right: 0 !important;
                margin-left: 0 !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                scrollbar-width: thin;
            }

            .glass-table {
                width: 680px !important;
                min-width: 680px !important;
                table-layout: fixed !important;
            }

            .glass-table th,
            .glass-table td {
                padding: 10px 11px !important;
                font-size: 0.76rem !important;
            }

            .glass-btn {
                min-height: 42px;
                padding: 9px 12px;
                font-size: 0.76rem;
            }

            .floating-editor-btn {
                right: 12px;
                bottom: calc(12px + env(safe-area-inset-bottom));
                min-height: 38px;
                padding: 9px 13px;
                background: #162f4e;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.38);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                font-size: 0.74rem;
            }

            #diets-floating-footer {
                right: 10px !important;
                bottom: calc(62px + env(safe-area-inset-bottom)) !important;
                left: 10px !important;
                width: auto !important;
                max-width: none !important;
                padding: 0 !important;
            }

            #diets-floating-footer .glass-panel {
                min-height: 58px;
                padding: 10px 13px !important;
                border-radius: 15px;
                background: rgba(14, 29, 49, 0.98) !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }

            .modal-overlay {
                align-items: flex-end;
                padding: 8px;
                padding-bottom: env(safe-area-inset-bottom);
                background: rgba(3, 8, 16, 0.84);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            .modal-box {
                width: 100%;
                max-width: 100%;
                max-height: calc(100dvh - 16px);
                padding: 17px;
                padding-bottom: calc(17px + env(safe-area-inset-bottom));
                border-radius: 20px;
                background: var(--glass-strong);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            .modal-input {
                min-height: 46px;
            }

            #manage-feeds-modal .modal-box > div:nth-child(2) {
                flex-direction: column !important;
            }

            #manage-feeds-modal .modal-box > div:nth-child(2) .glass-btn {
                width: 100%;
            }

            .glass-panel:hover,
            .glass-btn:hover,
            .menu-item:hover,
            .farm-btn:hover {
                border-color: inherit;
                background: inherit;
                box-shadow: inherit;
                transform: none;
            }
        }

        @media (max-width: 380px) {
            .app-layout {
                padding-right: 8px;
                padding-left: 8px;
            }

            .brand-title {
                font-size: 0.9rem;
            }

            #main-content h1 {
                font-size: 1.16rem !important;
            }

            .stat-value {
                font-size: 1.38rem !important;
            }

            .glass-table {
                width: 640px !important;
                min-width: 640px !important;
            }

            .glass-table th,
            .glass-table td {
                padding-right: 8px !important;
                padding-left: 8px !important;
                font-size: 0.7rem !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body data-module-active="livestock">
    <div class="bg-atmospheric" aria-hidden="true"></div>

    <header class="mobile-header">
        <button
            type="button"
            class="mobile-menu-icon"
            id="mobile-menu-icon-static"
            onclick="toggleMenu()"
            aria-label="Открыть меню"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <span class="mobile-header-title">
            Контроль•животноводство
        </span>
    </header>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <button
        id="floating-editor-btn"
        class="floating-editor-btn"
        type="button"
        onclick="toggleEditMode()"
    >
        <span id="editor-btn-icon">🔒</span>
        <span id="editor-btn-text">Просмотр</span>
    </button>

    <div class="app-layout">
        <nav id="sidebar" class="glass-panel" aria-label="Главное меню">
            <div class="brand-box">
                <div class="brand-logo">🌾</div>

                <div class="brand-content">
                    <div class="brand-title">
                        Контроль•животноводство
                    </div>

                    <div class="brand-subtitle">
                        Учет & Рационы
                    </div>
                </div>
            </div>

            <ul class="menu-list">
                <li
                    class="menu-item active"
                    onclick="navigate('dashboard', this)"
                >
                    <span>📊</span>
                    Дашборд
                </li>

                <li
                    class="menu-item"
                    onclick="navigate('diets', this)"
                >
                    <span>🥗</span>
                    Рационы & Корм
                </li>

                <li
                    class="menu-item"
                    onclick="navigate('herd', this)"
                >
                    <span>🐄</span>
                    Поголовье
                </li>

                <li
                    class="menu-item"
                    onclick="navigate('reports', this)"
                >
                    <span>📋</span>
                    Потребность
                </li>
                <li
                    class="menu-item"
                    onclick="navigate('history', this)"
                >
                    <span>🕘</span>
                    История операций
                </li>
            </ul>

            <div class="sidebar-footer">
                <div
                    class="sidebar-user"
                    id="sidebar-user"
                    hidden
                >
                    <div class="sidebar-user-avatar">
                        <span id="sidebar-user-initials">?</span>
                    </div>

                    <div class="sidebar-user-info">
                        <div
                            class="sidebar-user-name"
                            id="sidebar-user-name"
                        >
                            Пользователь
                        </div>

                        <div
                            class="sidebar-user-role"
                            id="sidebar-user-role"
                        >
                            Гость
                        </div>
                    </div>
                </div>

                <button
                    type="button"
                    class="glass-btn auth-logout-button"
                    onclick="window.location.href='/'"
                >
                    <span>←</span>
                    Назад
                </button>
            </div>
        </nav>

        <main id="main-content"></main>
    </div>

    <div
        id="diets-floating-footer"
        style="
            display: none;
            position: fixed;
            right: 20px;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            max-width: 1080px;
            margin: 0 auto;
        "
    ></div>

    <div id="add-feed-modal" class="modal-overlay">
        <div class="modal-box">
            <div
                style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 12px;
                "
            >
                <h3
                    style="
                        margin: 0;
                        color: #fff;
                        font-size: 1.08rem;
                        font-weight: 800;
                    "
                >
                    Добавить корм в рацион
                </h3>

                <button
                    type="button"
                    onclick="DietsModule.closeFeedModal()"
                    aria-label="Закрыть"
                    style="
                        border: none;
                        background: none;
                        color: var(--muted);
                        cursor: pointer;
                        font-size: 1.35rem;
                    "
                >
                    ✕
                </button>
            </div>

            <div
                style="
                    display: flex;
                    flex-direction: column;
                    gap: 13px;
                "
            >
                <div>
                    <label
                        for="modal-feed-select"
                        style="
                            display: block;
                            margin-bottom: 6px;
                            color: var(--muted);
                            font-size: 0.76rem;
                            font-weight: 600;
                        "
                    >
                        Выберите корм из справочника:
                    </label>

                    <select
                        id="modal-feed-select"
                        class="modal-input"
                    ></select>
                </div>

                <div>
                    <label
                        for="modal-feed-norm"
                        style="
                            display: block;
                            margin-bottom: 6px;
                            color: var(--muted);
                            font-size: 0.76rem;
                            font-weight: 600;
                        "
                    >
                        Суточная норма на 1 голову (кг):
                    </label>

                    <input
                        type="number"
                        id="modal-feed-norm"
                        class="modal-input"
                        step="0.1"
                        value="1.0"
                    >
                </div>

                <button
                    type="button"
                    class="glass-btn"
                    style="
                        width: 100%;
                        border-color: var(--green-dark);
                        color: var(--green);
                    "
                    onclick="DietsModule.confirmAddFeed()"
                >
                    + Сохранить в рацион
                </button>
            </div>
        </div>
    </div>

    <div id="manage-feeds-modal" class="modal-overlay">
        <div
            class="modal-box"
            style="max-width: 520px;"
        >
            <div
                style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 12px;
                "
            >
                <h3
                    style="
                        margin: 0;
                        color: #fff;
                        font-size: 1.08rem;
                        font-weight: 800;
                    "
                >
                    🧪 Справочник кормов и добавок
                </h3>

                <button
                    type="button"
                    onclick="DietsModule.closeManageFeedsModal()"
                    aria-label="Закрыть"
                    style="
                        border: none;
                        background: none;
                        color: var(--muted);
                        cursor: pointer;
                        font-size: 1.35rem;
                    "
                >
                    ✕
                </button>
            </div>

            <div
                style="
                    display: flex;
                    gap: 8px;
                "
            >
                <input
                    type="text"
                    id="new-feed-name-input"
                    class="modal-input"
                    placeholder="Название корма или добавки..."
                >

                <button
                    type="button"
                    class="glass-btn"
                    style="
                        border-color: var(--green-dark);
                        color: var(--green);
                        white-space: nowrap;
                    "
                    onclick="DietsModule.createFeedFromModal()"
                >
                    + Добавить
                </button>
            </div>

            <div
                id="modal-feeds-list"
                style="
                    display: flex;
                    flex-direction: column;
                    gap: 8px;
                    max-height: 280px;
                    margin-top: 8px;
                    padding-right: 4px;
                    overflow-y: auto;
                "
            ></div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="modules/common.js"></script>
    <script src="modules/auth.js"></script>

    <script src="modules/categories.js"></script>
    <script src="modules/movements.js"></script>
    <script src="modules/dashboard.js"></script>
    <script src="modules/diets.js"></script>
    <script src="modules/herd.js"></script>
    <script src="modules/reports.js"></script>
    <script src="modules/history.js"></script>

    <script src="../../js/app.js"></script>
</body>
</html>
