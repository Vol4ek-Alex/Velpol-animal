<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b1728">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Контроль•механизация</title>

    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/icon.svg">
    <link rel="apple-touch-icon" href="../../assets/icons/icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/offline-sync.js"></script>
    <script src="../../js/splash.js"></script>

    <style>
        :root {
            color-scheme: dark;

            --page-bg: #091728;
            --page-bg-deep: #060e1b;

            --glass: rgba(20, 39, 64, 0.44);
            --glass-strong: rgba(14, 30, 51, 0.96);
            --input-bg: rgba(3, 10, 20, 0.58);

            --line: rgba(255, 255, 255, 0.15);
            --line-bright: rgba(255, 255, 255, 0.28);
            --line-green: rgba(52, 211, 153, 0.48);

            --text: #f5f7fb;
            --muted: #a8b6c9;
            --subtle: #78879b;

            --green: #34d399;
            --green-dark: #10b981;
            --blue: #7dd3fc;
            --amber: #fbbf24;
            --red: #fb7185;

            --card-radius: 20px;
            --sidebar-width: 280px;

            --shadow:
                0 16px 44px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: clip;
            background: var(--page-bg-deep);
        }

        body {
            position: relative;
            isolation: isolate;
            width: 100%;
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow-x: clip;
            color: var(--text);
            background: var(--page-bg);
            font-family: "Exo 2", sans-serif;
            font-size: 15px;
            line-height: 1.4;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            color: inherit;
        }

        .bg-atmospheric {
            position: fixed;
            inset: -24px;
            z-index: -3;
            pointer-events: none;
            background:
                linear-gradient(
                    180deg,
                    #0a1930,
                    #060e1b
                );
            filter: blur(14px) brightness(0.9) saturate(1.08);
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 900ms ease;
        }

        .bg-layer-stat {
            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 31, 0.1),
                    rgba(4, 11, 22, 0.3)
                ),
                url("../../assets/backgrounds/bg_mech_stat.jpg") center center / cover no-repeat;
        }

        .bg-layer-park {
            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 31, 0.1),
                    rgba(4, 11, 22, 0.3)
                ),
                url("../../assets/backgrounds/bg_mech_park.jpg") center center / cover no-repeat;
        }

        body[data-bg="stat"] .bg-layer-stat,
        body[data-bg="park"] .bg-layer-park {
            opacity: 1;
        }

        /* Пока открыт экран приветствия — фоновые
           изображения скрыты (тёмный однотонный фон). */
        body.welcome-active .bg-layer {
            opacity: 0 !important;
        }

        .hidden {
            display: none !important;
        }

        .modal-overlay-fleet {
            position: fixed;
            inset: 0;
            background: rgba(3, 8, 16, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
            opacity: 0;
            transition: opacity 220ms ease;
        }

        .modal-overlay-fleet.open {
            opacity: 1;
        }

        /* Окно в едином стиле приложения
           (как .modal-box в Животноводстве). */
        .modal-box-fleet {
            position: relative;
            width: 100%;
            max-width: 480px;
            max-height: calc(100dvh - 32px);
            padding: 22px;
            overflow-y: auto;
            border: 1px solid var(--line-bright);
            border-radius: 22px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.08),
                    transparent 44%
                ),
                rgba(15, 31, 52, 0.97);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.58);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            color: #fff;
            transform: translateY(14px) scale(0.98);
            opacity: 0;
            transition:
                transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 220ms ease;
        }

        .modal-overlay-fleet.open .modal-box-fleet {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-box-fleet h3 {
            margin: 0 0 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
        }

        /* Заголовок модалки автопарка — как h3
           в .modal-box Животноводства. */
        .fleet-modal-title {
            margin: 0 0 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Моноширинные поля (госномер, VIN) —
           как .fleet-plate / .fleet-vin. */
        .fleet-field-mono {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.02em;
        }

        /* Селектор тегов в форме техники. */
        .fleet-tags-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: var(--input-bg);
            border-radius: 11px;
            border: 1px solid var(--line);
            max-height: 140px;
            overflow-y: auto;
        }

        .fleet-tags-picker label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            font-size: 0.72rem;
            font-weight: 800;
            color: #0b1728;
            cursor: pointer;
            user-select: none;
        }

        .fleet-tags-picker input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #10b981;
            cursor: pointer;
        }

        .fleet-color-input {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--input-bg);
            cursor: pointer;
        }

        .modal-close-x {
            position: absolute;
            top: 18px;
            right: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            transition:
                color 160ms ease,
                border-color 160ms ease,
                background-color 160ms ease,
                transform 160ms ease;
        }

        .modal-close-x:hover {
            color: #fff;
            border-color: var(--line);
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-close-x:active {
            transform: scale(0.94);
        }

        .modal-label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .modal-field {
            width: 100%;
            min-height: 44px;
            padding: 10px 13px;
            outline: none;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--input-bg);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 500;
            transition:
                border-color 160ms ease,
                box-shadow 160ms ease;
        }

        .modal-field:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
        }

        .modal-btn-primary {
            background: rgba(52, 211, 153, 0.18);
            border-color: var(--green);
            color: var(--green);
            font-weight: 700;
        }

        .modal-btn-primary:hover {
            background: rgba(52, 211, 153, 0.26);
        }

        .modal-btn-danger {
            background: rgba(251, 113, 133, 0.15);
            border-color: var(--red);
            color: var(--red);
            font-weight: 700;
        }

        .modal-btn-danger:hover {
            background: rgba(251, 113, 133, 0.24);
        }

        /* === Автомодуль: автопарк === */
        .fleet-group {
            margin-bottom: 24px;
        }

        .fleet-group-title {
            margin: 0 0 12px 2px;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--subtle);
        }

        .fleet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .fleet-card {
            position: relative;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, 0.08),
                    transparent 44%),
                rgba(15, 31, 52, 0.97);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition:
                border-color 200ms ease,
                transform 200ms ease,
                box-shadow 200ms ease;
        }

        /* Статусные карточки — акцентная полоса слева,
           как .menu-item.active::before в Животноводстве. */
        .fleet-card.is-broken {
            border-color: rgba(251, 113, 133, 0.45);
        }

        .fleet-card.is-warranty {
            border-color: rgba(125, 211, 252, 0.45);
        }

        .fleet-card.is-broken::before,
        .fleet-card.is-warranty::before {
            position: absolute;
            top: 14%;
            bottom: 14%;
            left: 0;
            width: 3px;
            border-radius: 0 4px 4px 0;
            content: "";
        }

        .fleet-card.is-broken::before {
            background: var(--red);
            box-shadow: 0 0 12px var(--red);
        }

        .fleet-card.is-warranty::before {
            background: var(--blue);
            box-shadow: 0 0 12px var(--blue);
        }

        .fleet-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.42);
        }

        .fleet-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .fleet-card-head h4 {
            margin: 0;
            font-weight: 800;
            color: #fff;
            font-size: 0.92rem;
            letter-spacing: -0.01em;
        }

        .fleet-card-edit {
            border: none;
            background: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            transition: color 150ms ease;
        }

        .fleet-card-edit:hover {
            color: #fff;
        }

        .fleet-card-driver {
            font-size: 0.78rem;
            color: var(--muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fleet-card-driver-name {
            color: #fff;
            font-weight: 800;
        }

        .fleet-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .fleet-tag {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #0b1728;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .fleet-card-ids {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .fleet-plate {
            font-size: 0.84rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--line-bright);
            padding: 6px 12px;
            border-radius: 10px;
            letter-spacing: 0.05em;
        }

        .fleet-inv {
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--subtle);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--line);
        }

        .fleet-vin {
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--subtle);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fleet-card-docs {
            padding-top: 12px;
            margin-top: 2px;
            border-top: 1px solid var(--line);
            font-size: 0.76rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .fleet-doc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fleet-doc-row span:first-child {
            color: var(--muted);
            font-weight: 700;
        }

        .fleet-doc-value {
            font-weight: 800;
            color: #fff;
        }

        .fleet-doc-badge {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .fleet-doc-badge.is-overdue {
            color: var(--red);
            background: rgba(251, 113, 133, 0.12);
            border: 1px solid rgba(251, 113, 133, 0.4);
        }

        .fleet-doc-badge.is-soon {
            color: var(--amber);
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .fleet-doc-badge.is-ok {
            color: var(--muted);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
        }

        .fleet-doc-badge.is-muted {
            color: var(--subtle);
            font-weight: 700;
        }

        .fleet-tasks-btn {
            margin-top: 4px;
            font-size: 0.76rem;
            text-align: center;
            font-weight: 700;
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.4);
            color: var(--green);
        }

        .fleet-tasks-btn:hover {
            background: rgba(52, 211, 153, 0.18);
        }

        .fleet-empty {
            padding: 40px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.84rem;
            font-weight: 700;
        }

        .fleet-toolbar {
            padding: 22px;
            margin-bottom: 20px;
        }

        .fleet-toolbar-head {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .fleet-toolbar-head h2 {
            margin: 0;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fleet-toolbar-icon {
            font-size: 1.6rem;
        }

        .fleet-toolbar-head p {
            margin: 0;
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 500;
        }

        .fleet-toolbar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .fleet-btn-blue {
            background: rgba(125, 211, 252, 0.15);
            border-color: var(--blue);
            color: var(--blue);
        }

        .fleet-search-panel {
            padding: 20px;
            margin-bottom: 20px;
        }

        .fleet-search-fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 14px;
        }

        .fleet-categories-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }

        .fleet-grid-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .fleet-list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .fleet-list-name {
            color: #fff;
        }

        .fleet-list-tag {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fleet-list-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: inline-block;
        }

        .fleet-list-delete {
            border: none;
            background: none;
            color: var(--red);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 2px 4px;
            border-radius: 6px;
            transition: background-color 150ms ease;
        }

        .fleet-list-delete:hover {
            text-decoration: underline;
            background: rgba(251, 113, 133, 0.08);
        }

        .fleet-tasks-empty {
            text-align: center;
            color: var(--muted);
            padding: 12px 0;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .fleet-task-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 9px 11px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--amber);
        }

        .fleet-task-row span {
            word-break: break-word;
        }

        .fleet-task-done {
            border: none;
            background: none;
            color: var(--green);
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.78rem;
            padding: 2px 6px;
            border-radius: 6px;
            transition: background-color 150ms ease;
        }

        .fleet-task-done:hover {
            background: rgba(52, 211, 153, 0.12);
        }

        .suggestion-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            min-height: 36px;
            padding: 7px 12px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            background: transparent;
            color: var(--subtle);
            cursor: pointer;
            font-size: 0.74rem;
            font-weight: 600;
            transition: color 180ms ease, border-color 180ms ease, background-color 180ms ease;
        }

        .suggestion-button:hover {
            color: var(--green);
            border-color: rgba(52, 211, 153, 0.45);
            background: rgba(52, 211, 153, 0.06);
        }

        .suggestion-textarea {
            width: 100%;
            min-height: 110px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.86rem;
            line-height: 1.5;
            resize: vertical;
        }

        .suggestion-textarea:focus {
            outline: none;
            border-color: var(--green);
        }

        .bg-atmospheric::after {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(5, 13, 25, 0.1) 0%,
                    rgba(5, 14, 27, 0.06) 45%,
                    rgba(3, 9, 18, 0.34) 100%
                ),
                radial-gradient(
                    ellipse at center,
                    rgba(8, 20, 36, 0.02),
                    rgba(3, 8, 16, 0.26)
                );
            content: "";
        }

        .app-layout {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 20px;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 14px;
        }

        .glass-panel {
            position: relative;
            min-width: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top-color: rgba(255, 255, 255, 0.26);
            border-radius: var(--card-radius);
            background:
                linear-gradient(
                    150deg,
                    rgba(255, 255, 255, 0.1),
                    rgba(255, 255, 255, 0.025) 42%,
                    transparent
                ),
                var(--glass);
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter:
                blur(20px) saturate(140%);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        #sidebar {
            position: sticky;
            top: 14px;
            z-index: 100;
            align-self: flex-start;
            display: flex;
            flex: 0 0 var(--sidebar-width);
            flex-direction: column;
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: calc(100vh - 28px);
            height: calc(100dvh - 28px);
            padding: 20px;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.09),
                    transparent 44%
                ),
                rgba(14, 30, 51, 0.78);
        }

        .brand-box {
            display: flex;
            align-items: flex-start;
            gap: 11px;

            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--muted);
        }

        .fleet-group-count {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--subtle);
            letter-spacing: 0.04em;
        }

        /* Кнопки категорий — горизонтальный скролл */
        .fleet-categories-bar {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .fleet-categories-bar::-webkit-scrollbar {
            display: none;
        }

        .fleet-cat-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            min-height: 34px;
            padding: 6px 14px;
            border: 1px solid var(--line-bright);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            transition:
                color 160ms ease,
                background-color 160ms ease,
                border-color 160ms ease,
                transform 160ms ease,
                box-shadow 160ms ease;
            white-space: nowrap;
        }

        .fleet-cat-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .fleet-cat-btn:active {
            transform: scale(0.96);
        }

        .fleet-cat-btn--active {
            color: var(--green);
            background: rgba(52, 211, 153, 0.14);
            border-color: rgba(52, 211, 153, 0.55);
            box-shadow: 0 0 18px rgba(52, 211, 153, 0.12);
        }

        .fleet-cat-btn__icon {
            font-size: 0.9rem;
        }

        .fleet-cat-btn__count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--muted);
        }

        .fleet-cat-btn--active .fleet-cat-btn__count {
            background: rgba(52, 211, 153, 0.2);
            color: var(--green);
        }

        /* ===== Карточка v2 ===== */
        .fleet-card-v2 {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 18px 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background:
                linear-gradient(
                    150deg,
                    rgba(255, 255, 255, 0.09) 0%,
                    rgba(255, 255, 255, 0.03) 40%,
                    transparent 70%
                ),
                rgba(12, 26, 46, 0.92);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.28),
                0 2px 8px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            cursor: pointer;
            overflow: hidden;
            transition:
                border-color 220ms ease,
                transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 220ms ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Декоративная полоса слева для статусных карточек */
        .fleet-card-v2::before {
            position: absolute;
            top: 16%;
            bottom: 16%;
            left: 0;
            width: 3px;
            border-radius: 0 3px 3px 0;
            content: "";
            opacity: 0;
            transition: opacity 220ms ease;
        }

        .fleet-card-v2.is-broken {
            border-color: rgba(251, 113, 133, 0.35);
            background:
                linear-gradient(
                    150deg,
                    rgba(251, 113, 133, 0.07) 0%,
                    rgba(255, 255, 255, 0.02) 40%,
                    transparent 70%
                ),
                rgba(12, 26, 46, 0.92);
        }

        .fleet-card-v2.is-broken::before {
            background: var(--red);
            box-shadow: 0 0 14px var(--red);
            opacity: 1;
        }

        .fleet-card-v2.is-warranty {
            border-color: rgba(125, 211, 252, 0.35);
            background:
                linear-gradient(
                    150deg,
                    rgba(125, 211, 252, 0.07) 0%,
                    rgba(255, 255, 255, 0.02) 40%,
                    transparent 70%
                ),
                rgba(12, 26, 46, 0.92);
        }

        .fleet-card-v2.is-warranty::before {
            background: var(--blue);
            box-shadow: 0 0 14px var(--blue);
            opacity: 1;
        }

        .fleet-card-v2:hover {
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-4px);
            box-shadow:
                0 20px 56px rgba(0, 0, 0, 0.38),
                0 4px 16px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .fleet-card-v2.is-broken:hover {
            border-color: rgba(251, 113, 133, 0.55);
        }

        .fleet-card-v2.is-warranty:hover {
            border-color: rgba(125, 211, 252, 0.55);
        }

        /* Шапка карточки */
        .fv2-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .fv2-header-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .fv2-header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* Индикатор статуса */
        .fv2-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .fv2-dot-green {
            background: var(--green);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.7);
        }

        .fv2-dot-red {
            background: var(--red);
            box-shadow: 0 0 8px rgba(251, 113, 133, 0.7);
        }

        .fv2-dot-blue {
            background: var(--blue);
            box-shadow: 0 0 8px rgba(125, 211, 252, 0.7);
        }

        .fv2-status-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--subtle);
        }

        /* Кнопка редактирования */
        .fv2-edit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--subtle);
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1;
            transition:
                color 150ms ease,
                background-color 150ms ease,
                border-color 150ms ease;
        }

        .fv2-edit-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--line-bright);
        }

        /* Название модели */
        .fv2-model {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        /* Госномер + инв. */
        .fv2-ids {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* VIN */
        .fv2-vin {
            font-size: 0.68rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--subtle);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Водитель */
        .fv2-driver {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .fv2-driver-role {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--subtle);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .fv2-driver-name {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Разделитель */
        .fv2-divider {
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1) 20%,
                rgba(255, 255, 255, 0.1) 80%,
                transparent
            );
            margin: 2px 0;
        }

        /* Метрики */
        .fv2-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .fv2-metric {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .fv2-metric-label {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--subtle);
        }

        .fv2-metric-value {
            font-size: 0.92rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .fv2-metric-unit {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--muted);
        }

        /* Значения документов */
        .fv2-doc-val {
            font-size: 0.74rem;
            font-weight: 700;
            line-height: 1.3;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .fv2-doc-val.is-ok {
            color: var(--muted);
        }

        .fv2-doc-val.is-muted {
            color: var(--subtle);
        }

        .fv2-doc-val.is-soon {
            color: var(--amber);
        }

        .fv2-doc-val.is-overdue {
            color: var(--red);
        }

        .fv2-doc-sub {
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            opacity: 0.85;
        }

        /* Кнопка задач */
        .fv2-tasks-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            min-height: 36px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--subtle);
            cursor: pointer;
            font-size: 0.76rem;
            font-weight: 700;
            transition:
                color 160ms ease,
                background-color 160ms ease,
                border-color 160ms ease;
        }

        .fv2-tasks-btn:hover {
            color: var(--muted);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .fv2-tasks-btn--has {
            color: var(--green);
            background: rgba(52, 211, 153, 0.08);
            border-color: rgba(52, 211, 153, 0.3);
        }

        .fv2-tasks-btn--has:hover {
            background: rgba(52, 211, 153, 0.14);
            border-color: rgba(52, 211, 153, 0.5);
        }

        .fv2-tasks-icon {
            font-size: 0.9rem;
        }

        .fv2-tasks-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: rgba(52, 211, 153, 0.2);
            color: var(--green);
            font-size: 0.65rem;
            font-weight: 800;
        }

        /* Адаптив карточек */
        .fleet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        @media (max-width: 700px) {
            .fleet-grid {
                grid-template-columns: 1fr;
            }

            .fv2-metrics {
                grid-template-columns: 1fr 1fr;
            }

            .fv2-metrics .fv2-metric:first-child {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 480px) {
            .fleet-card-v2 {
                padding: 14px 16px 12px;
            }
        }
    </style>
</head>

    <script type="module">
        import { init as initDashboard } from './dashboard.js';
        import { init as initFleet } from './fleet.js';

        const SUPABASE_URL = "https://xoouaazntzbkjwyzggiz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_NEv4wb8ErPkNk5e8OVf-5A_XRaVFW6-";
        window._supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const modules = {
            dashboard: initDashboard,
            fleet: initFleet
        };

        let currentModule = null;

        function switchBg(moduleId) {
            document.body.dataset.bg = moduleId === 'fleet' ? 'park' : 'stat';
        }

        window.navigate = async function(moduleId, menuItem) {
            if (currentModule === moduleId) { closeMobileMenu(); return; }

            // В режиме редактирования кнопка видна
            // только в «Автопарке» — там находятся
            // все операции записи.
            updateEditorButtonVisibility(moduleId);

            currentModule = moduleId;
            switchBg(moduleId);

            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            if (menuItem) {
                menuItem.classList.add('active');
            } else {
                const match = Array.from(document.querySelectorAll('.menu-item')).find(item =>
                    (item.getAttribute('onclick') || '').includes(`'${moduleId}'`)
                );
                if (match) match.classList.add('active');
            }

            closeMobileMenu();
            hideWelcome();

            const content = document.getElementById('main-content');
            content.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: var(--muted);">Загрузка...</div>';

            if (modules[moduleId]) {
                await modules[moduleId]();
            }
        };

        function hideWelcome() {
            document.body.classList.remove('welcome-active');
            const w = document.getElementById('welcome-screen');
            if (w) {
                w.classList.add('welcome-hide');
                setTimeout(() => w.remove(), 450);
            }
        }

        /* ===== Режим редактирования (аналог Животноводства) ===== */
        function updateEditorButtonVisibility(moduleId) {
            const button =
                document.getElementById('floating-editor-btn');

            if (!button) return;

            const show =
                moduleId === 'fleet' &&
                window._mechEditMode === true;

            button.classList.toggle('editor-hidden', !show);
        }

        function setupMechEditMode() {
            const button =
                document.getElementById('floating-editor-btn');

            if (!button) return;

            button.addEventListener('click', () => {
                window._mechEditMode =
                    !window._mechEditMode;

                button.classList.toggle(
                    'active',
                    window._mechEditMode
                );

                const icon =
                    document.getElementById('editor-btn-icon');

                const text =
                    document.getElementById('editor-btn-text');

                if (icon) {
                    icon.textContent =
                        window._mechEditMode ? '✏️' : '🔒';
                }

                if (text) {
                    text.textContent =
                        window._mechEditMode
                            ? 'Редактирование ВКЛ'
                            : 'Просмотр';
                }

                document.body.classList.toggle(
                    'edit-mode-active',
                    window._mechEditMode
                );

                if (
                    typeof window._mechOnEditModeChange ===
                    'function'
                ) {
                    window._mechOnEditModeChange(
                        window._mechEditMode
                    );
                }
            });
        }

        function setupMobileMenu() {
            const menuFab = document.getElementById('menu-fab');
            const menuIcon = document.getElementById('mobile-menu-icon-static');
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');

            const openMenu = function () {
                sidebar.classList.add('open');
                backdrop.classList.add('open');
                document.body.classList.add('menu-open');
                if (menuFab) menuFab.setAttribute('aria-expanded', 'true');
                if (menuIcon) menuIcon.setAttribute('aria-expanded', 'true');
            };

            const toggleMenu = function (event) {
                event.preventDefault();
                event.stopPropagation();
                if (event.stopImmediatePropagation) event.stopImmediatePropagation();

                const isOpen = sidebar.classList.contains('open');
                if (isOpen) {
                    closeMobileMenu();
                } else {
                    openMenu();
                }
            };

            if (menuFab) menuFab.addEventListener('click', toggleMenu);
            if (menuIcon) menuIcon.addEventListener('click', toggleMenu);

            if (backdrop) {
                backdrop.addEventListener('click', function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    closeMobileMenu();
                });
            }

            if (sidebar) {
                sidebar.addEventListener('click', function (event) {
                    event.stopPropagation();
                });
            }
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const menuIcon = document.getElementById('mobile-menu-icon-static');
            const menuFab = document.getElementById('menu-fab');

            if (sidebar) sidebar.classList.remove('open');
            if (backdrop) backdrop.classList.remove('open');
            if (document.body) document.body.classList.remove('menu-open');
            if (menuIcon) menuIcon.setAttribute('aria-expanded', 'false');
            if (menuFab) menuFab.setAttribute('aria-expanded', 'false');
        }

        window.closeMobileMenu = closeMobileMenu;

        function showSimpleMessage(title, message) {
            const existing = document.getElementById('simple-message-overlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.id = 'simple-message-overlay';
            overlay.className = 'modal-overlay-fleet';

            overlay.innerHTML = `
                <div class="modal-box-fleet">
                    <button type="button" class="modal-close-x" aria-label="Закрыть" onclick="document.getElementById('simple-message-overlay').remove()">✕</button>
                    <h3>${window.escapeHtml ? window.escapeHtml(title) : title}</h3>
                    <p style="margin:0; color: var(--muted); font-size: 0.88rem; line-height: 1.55;">${window.escapeHtml ? window.escapeHtml(message) : message}</p>
                    <button type="button" class="glass-btn modal-btn-primary" style="width: 100%; margin-top: 18px;" onclick="document.getElementById('simple-message-overlay').remove()">Понятно</button>
                </div>
            `;

            document.body.appendChild(overlay);
            overlay.addEventListener('click', function (event) {
                if (event.target === overlay) overlay.remove();
            });
            requestAnimationFrame(function () {
                overlay.classList.add('open');
            });
        }
        window.showSimpleMessage = showSimpleMessage;

        window.openSuggestionModal = function () {
            const modal = document.getElementById('suggestion-modal');
            if (!modal) return;
            modal.style.display = 'flex';
            const textarea = document.getElementById('suggestion-text');
            if (textarea) {
                textarea.value = '';
                setTimeout(() => textarea.focus(), 60);
            }
        };

        window.closeSuggestionModal = function () {
            const modal = document.getElementById('suggestion-modal');
            if (modal) modal.style.display = 'none';
        };

        window.sendSuggestion = async function () {
            const textarea = document.getElementById('suggestion-text');
            const sendButton = document.getElementById('suggestion-send-button');
            const text = String(textarea ? textarea.value : '').trim();

            if (text.length < 3) {
                window.showSimpleMessage('Пустое предложение', 'Опишите вашу идею подробнее — минимум 3 символа.');
                return;
            }

            if (sendButton) sendButton.disabled = true;

            try {
                let user = null;
                try {
                    if (window.AuthModule && window.AuthModule.session) {
                        user = window.AuthModule.session.user;
                    }
                } catch (e) { user = null; }

                if (!user) {
                    try {
                        const data = await window._supabase.auth.getUser();
                        user = data && data.user && data.user.id ? data.user : null;
                    } catch (e) { user = null; }
                }

                let authorName = 'Неизвестный';
                if (user) {
                    try {
                        const { data: prof } = await window._supabase
                            .from('user_profiles')
                            .select('full_name')
                            .eq('id', user.id)
                            .maybeSingle();
                        authorName = (prof && prof.full_name) || (user.user_metadata || {}).full_name || user.email || 'Неизвестный';
                    } catch (e) {
                        authorName = (user.user_metadata || {}).full_name || user.email || 'Неизвестный';
                    }
                } else {
                    try {
                        const stored = JSON.parse(localStorage.getItem('velpol_user'));
                        if (stored) authorName = stored.full_name || stored.email || 'Неизвестный';
                    } catch (e) { /* ignore */ }
                }

                const { error } = await window._supabase
                    .from('suggestions')
                    .insert({
                        text: text,
                        user_id: user ? user.id : null,
                        user_name: authorName,
                        page: 'mechanization'
                    });

                if (error) throw error;

                window.closeSuggestionModal();
                window.showSimpleMessage('Спасибо!', 'Ваше предложение отправлено администратору.');
            } catch (error) {
                console.error('Suggestion error:', error);
                window.showSimpleMessage('Ошибка', 'Не удалось отправить предложение. Попробуйте позже.');
            } finally {
                if (sendButton) sendButton.disabled = false;
            }
        };

        async function checkMechAccess() {
            let user = null;
            try {
                const { data } = await window._supabase.auth.getUser();
                user = data && data.user ? data.user : null;
            } catch (e) { user = null; }

            if (!user) {
                window.location.href = '../index.html';
                return false;
            }

            try {
                const { data: access } = await window._supabase
                    .from('module_access')
                    .select('module_name, has_access')
                    .eq('user_id', user.id)
                    .eq('has_access', true);

                const list = access || [];
                const isAdmin = list.some(a => a.module_name === 'admin');
                const hasMech = isAdmin || list.some(a => a.module_name === 'mechanization');
                const canEditMech = isAdmin || list.some(a => a.module_name === 'mechanization_edit');

                if (!hasMech) {
                    alert('У вас нет доступа к модулю «Механизация». Обратитесь к администратору.');
                    await window._supabase.auth.signOut();
                    window.location.href = '../index.html';
                    return false;
                }

                window._mechUser = user;
                window._mechIsAdmin = isAdmin;

                // Режим редактирования: администратор
                // или явное право mechanization_edit.
                window._mechEditMode = canEditMech;
                setupMechEditMode();
                return true;
            } catch (e) {
                console.error('Access check error:', e);
                window.location.href = '../index.html';
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await checkMechAccess();
            if (!ok) return;
            setupMobileMenu();
            closeMobileMenu();
            renderWelcome();
            setTimeout(() => {
                document.body.classList.add('app-booted');
            }, 500);
        });

        async function renderWelcome() {
            document.body.classList.add('welcome-active');
            let login = '';
            let stored = null;
            try {
                stored = JSON.parse(localStorage.getItem('velpol_user') || 'null');
            } catch (e) { stored = null; }
            if (stored) login = stored.full_name || stored.login || '';

            try {
                const { data } = await window._supabase.auth.getUser();
                if (data && data.user) {
                    const meta = data.user.user_metadata || {};
                    login = meta.full_name || meta.login || login;
                    try {
                        const { data: prof } = await window._supabase
                            .from('user_profiles')
                            .select('login, full_name')
                            .eq('id', data.user.id)
                            .maybeSingle();
                        /* Видимое имя вместо технического логина. */
                        if (prof) login = prof.full_name || prof.login || login;
                    } catch (e) { /* ignore */ }
                }
            } catch (e) { /* ignore */ }

            const fullName = String(login).trim() || 'гость';
            const hour = new Date().getHours();
            const dayPart = hour < 5 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';

            const content = document.getElementById('main-content');
            if (!content) return;
            content.innerHTML = `
                <div id="welcome-screen" class="welcome-screen">
                    <div class="welcome-card">
                        <div class="welcome-logo">🚜</div>
                        <h1 class="welcome-title">${dayPart}, ${fullName}!</h1>
                        <p class="welcome-sub">Добро пожаловать в «Механизацию» — учёт техники и планирование работ.</p>
                        <div class="welcome-hint">
                            <span class="welcome-hint-icon">☰</span>
                            <span>Нажмите <b>«Меню»</b>, чтобы начать</span>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
