<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b1728">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Контроль•механизация</title>

    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/icon.svg">
    <link rel="apple-touch-icon" href="../../assets/icons/icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            color-scheme: dark;

            --page-bg: #091728;
            --page-bg-deep: #060e1b;

            --glass: rgba(20, 39, 64, 0.44);
            --glass-strong: rgba(14, 30, 51, 0.96);
            --input-bg: rgba(3, 10, 20, 0.58);

            --line: rgba(255, 255, 255, 0.15);
            --line-bright: rgba(255, 255, 255, 0.28);
            --line-green: rgba(52, 211, 153, 0.48);

            --text: #f5f7fb;
            --muted: #a8b6c9;
            --subtle: #78879b;

            --green: #34d399;
            --green-dark: #10b981;
            --blue: #7dd3fc;
            --amber: #fbbf24;
            --red: #fb7185;

            --card-radius: 20px;
            --sidebar-width: 280px;

            --shadow:
                0 16px 44px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: clip;
            background: var(--page-bg-deep);
        }

        body {
            position: relative;
            isolation: isolate;
            width: 100%;
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow-x: clip;
            color: var(--text);
            background: var(--page-bg);
            font-family: "Exo 2", sans-serif;
            font-size: 15px;
            line-height: 1.4;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            color: inherit;
        }

        .bg-atmospheric {
            position: fixed;
            inset: -24px;
            z-index: -3;
            pointer-events: none;
            background:
                linear-gradient(
                    180deg,
                    #0a1930,
                    #060e1b
                );
            filter: blur(14px) brightness(0.9) saturate(1.08);
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 900ms ease;
        }

        .bg-layer-stat {
            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 31, 0.1),
                    rgba(4, 11, 22, 0.3)
                ),
                url("../../assets/backgrounds/bg_mech_stat.jpg") center center / cover no-repeat;
        }

        .bg-layer-park {
            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 31, 0.1),
                    rgba(4, 11, 22, 0.3)
                ),
                url("../../assets/backgrounds/bg_mech_park.jpg") center center / cover no-repeat;
        }

        body[data-bg="stat"] .bg-layer-stat,
        body[data-bg="park"] .bg-layer-park {
            opacity: 1;
        }

        .hidden {
            display: none !important;
        }

        .modal-overlay-fleet {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .suggestion-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            min-height: 36px;
            padding: 7px 12px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            background: transparent;
            color: var(--subtle);
            cursor: pointer;
            font-size: 0.74rem;
            font-weight: 600;
            transition: color 180ms ease, border-color 180ms ease, background-color 180ms ease;
        }

        .suggestion-button:hover {
            color: var(--green);
            border-color: rgba(52, 211, 153, 0.45);
            background: rgba(52, 211, 153, 0.06);
        }

        .suggestion-textarea {
            width: 100%;
            min-height: 110px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.86rem;
            line-height: 1.5;
            resize: vertical;
        }

        .suggestion-textarea:focus {
            outline: none;
            border-color: var(--green);
        }

        .bg-atmospheric::after {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(5, 13, 25, 0.1) 0%,
                    rgba(5, 14, 27, 0.06) 45%,
                    rgba(3, 9, 18, 0.34) 100%
                ),
                radial-gradient(
                    ellipse at center,
                    rgba(8, 20, 36, 0.02),
                    rgba(3, 8, 16, 0.26)
                );
            content: "";
        }

        .app-layout {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 20px;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 14px;
        }

        .glass-panel {
            position: relative;
            min-width: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top-color: rgba(255, 255, 255, 0.26);
            border-radius: var(--card-radius);
            background:
                linear-gradient(
                    150deg,
                    rgba(255, 255, 255, 0.1),
                    rgba(255, 255, 255, 0.025) 42%,
                    transparent
                ),
                var(--glass);
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter:
                blur(20px) saturate(140%);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        #sidebar {
            position: sticky;
            top: 14px;
            z-index: 100;
            align-self: flex-start;
            display: flex;
            flex: 0 0 var(--sidebar-width);
            flex-direction: column;
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: calc(100vh - 28px);
            height: calc(100dvh - 28px);
            padding: 20px;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.09),
                    transparent 44%
                ),
                rgba(14, 30, 51, 0.78);
        }

        .brand-box {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            width: 100%;
            min-width: 0;
            margin-bottom: 20px;
            padding-bottom: 17px;
            border-bottom: 1px solid var(--line);
        }

        .brand-logo {
            display: flex;
            flex: 0 0 42px;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            background: linear-gradient(135deg, #34d399, #047857);
            box-shadow:
                0 8px 24px rgba(16, 185, 129, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
        }

        .brand-content {
            flex: 1 1 auto;
            min-width: 0;
            padding-top: 1px;
        }

        .brand-title {
            display: block;
            width: 100%;
            max-width: 175px;
            overflow-wrap: anywhere;
            color: #fff;
            font-size: 0.98rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.035em;
        }

        .brand-subtitle {
            display: block;
            margin-top: 5px;
            color: var(--green);
            font-size: 0.64rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            flex: 0 1 auto;
            gap: 5px;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .sidebar-footer {
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .sidebar-footer .auth-logout-button {
            width: 100%;
            min-height: 42px;
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 46px;
            padding: 9px 12px;
            border: 1px solid transparent;
            border-radius: 14px;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 600;
            overflow: hidden;
            transition:
                color 180ms ease,
                background-color 180ms ease,
                border-color 180ms ease,
                transform 180ms ease,
                box-shadow 180ms ease;
        }

        .menu-item > span:first-child {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            transition:
                background-color 180ms ease,
                border-color 180ms ease,
                transform 220ms ease;
        }

        .menu-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateX(3px);
        }

        .menu-item:hover > span:first-child {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.06) rotate(-4deg);
        }

        .menu-item.active {
            border-color: transparent;
            color: #fff;
            background:
                linear-gradient(
                    135deg,
                    rgba(16, 185, 129, 0.22),
                    rgba(52, 211, 153, 0.06)
                ),
                rgba(9, 22, 39, 0.4);
            box-shadow:
                0 10px 26px rgba(16, 185, 129, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .menu-item.active > span:first-child {
            border-color: rgba(52, 211, 153, 0.55);
            background: linear-gradient(
                135deg,
                #34d399,
                #047857
            );
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        .menu-item.active::before {
            position: absolute;
            top: 14%;
            bottom: 14%;
            left: 0;
            width: 3px;
            border-radius: 0 4px 4px 0;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
            content: "";
        }

        .menu-item.active::after {
            position: absolute;
            top: 0;
            right: -60px;
            width: 44px;
            height: 100%;
            background: radial-gradient(
                ellipse,
                rgba(52, 211, 153, 0.14),
                transparent 70%
            );
            content: "";
        }

        .app-footer {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 0;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            color: var(--subtle);
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }

        #main-content {
            flex: 1 1 auto;
            width: 100%;
            min-width: 0;
            padding-bottom: 150px;
            animation: none !important;
            transition: none !important;
        }

        #main-content.module-loading,
        #main-content.module-loaded {
            opacity: 1 !important;
            animation: none !important;
            transition: none !important;
        }

        .mobile-header {
            display: none;
        }

        /* Плавающая кнопка меню (только телефон) */
        .menu-fab {
            display: none;
        }

        @media (max-width: 700px) {
            .menu-fab {
                position: fixed;
                top: 14px;
                left: 14px;
                z-index: 1500;
                display: inline-flex;
                align-items: center;
                gap: 9px;
                min-height: 44px;
                padding: 9px 16px 9px 12px;
                border: 1px solid var(--line-bright);
                border-radius: 999px;
                background: var(--glass-strong);
                color: var(--text);
                cursor: pointer;
                font-size: 0.82rem;
                font-weight: 800;
                letter-spacing: 0.02em;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
                backdrop-filter: blur(18px) saturate(1.2);
                -webkit-backdrop-filter: blur(18px) saturate(1.2);
                transition:
                    transform 320ms cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 320ms ease,
                    box-shadow 220ms ease,
                    border-color 220ms ease;
            }
        }

        .menu-fab:hover {
            border-color: var(--line-green);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42), 0 0 22px rgba(52, 211, 153, 0.14);
        }

        .menu-fab:active {
            transform: scale(0.96);
        }

        /* Кнопка красиво уезжает влево при открытом меню */
        body.menu-open .menu-fab {
            transform: translateX(calc(-100% - 40px));
            opacity: 0;
            pointer-events: none;
        }

        .menu-fab-icon {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 24px;
            height: 24px;
        }

        .menu-fab-icon span {
            display: block;
            width: 18px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--green), #a7f3d0);
            transition: transform 260ms ease, opacity 180ms ease;
        }

        .menu-fab[aria-expanded="true"] .menu-fab-icon span:nth-child(1) {
            transform: translateY(6px) rotate(45deg);
        }

        .menu-fab[aria-expanded="true"] .menu-fab-icon span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .menu-fab[aria-expanded="true"] .menu-fab-icon span:nth-child(3) {
            transform: translateY(-6px) rotate(-45deg);
        }

        .menu-fab-label {
            line-height: 1;
        }

        .menu-fab-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        /* Стартовое приветствие */
        .welcome-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100dvh - 60px);
            padding: 24px 0;
            transition: opacity 420ms ease, transform 420ms ease;
        }

        .welcome-screen.welcome-hide {
            opacity: 0;
            transform: translateY(16px) scale(0.98);
            pointer-events: none;
        }

        .welcome-card {
            max-width: 460px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            background: none;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            animation: welcome-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes welcome-in {
            from { opacity: 0; transform: translateY(22px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .welcome-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: linear-gradient(135deg, #34d399, #047857);
            box-shadow: 0 12px 32px rgba(16, 185, 129, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            font-size: 2rem;
            animation: welcome-bounce 3.2s ease-in-out infinite;
        }

        @keyframes welcome-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .welcome-title {
            margin: 0 0 10px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .welcome-sub {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.55;
        }

        .welcome-hint {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border: 1px dashed rgba(52, 211, 153, 0.5);
            border-radius: 999px;
            background: rgba(52, 211, 153, 0.07);
            color: var(--green);
            font-size: 0.84rem;
            font-weight: 700;
            animation: hint-pulse 2.2s ease-in-out infinite;
        }

        @keyframes hint-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.25); }
            50% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
        }

        .welcome-hint-icon {
            font-size: 1rem;
        }

        .mobile-menu-icon {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 42px;
            min-height: 42px;
            padding: 0;
            border: 1px solid var(--line-bright);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            cursor: pointer;
            transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
        }

        .mobile-menu-icon span {
            display: block;
            width: 20px;
            height: 2px;
            border-radius: 2px;
            background: #fff;
            transition: transform 240ms ease, opacity 180ms ease;
        }

        .mobile-menu-icon[aria-expanded="true"] {
            border-color: var(--line-green);
            background: rgba(16, 185, 129, 0.18);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .mobile-menu-icon:active {
            transform: scale(0.94);
        }

        @keyframes panel-in {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body:not(.app-booted) .glass-panel,
        body:not(.app-booted) .stat-card {
            animation: panel-in 320ms ease both;
        }

        body:not(.app-booted) #main-content > div:first-child > .stat-card,
        body:not(.app-booted) #main-content > div:first-child > .glass-panel {
            animation-delay: 40ms;
        }

        .menu-btn {
            min-height: 38px;
            padding: 7px 12px;
            border: 1px solid var(--line-bright);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .glass-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 40px;
            padding: 9px 14px;
            border: 1px solid var(--line-bright);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition:
                border-color 160ms ease,
                background-color 160ms ease,
                box-shadow 160ms ease,
                transform 160ms ease;
        }

        .glass-btn:hover {
            border-color: rgba(255, 255, 255, 0.32);
            background: rgba(255, 255, 255, 0.12);
        }

        .glass-btn:active {
            transform: scale(0.97);
        }

        .glass-btn:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        #sidebar-backdrop {
            display: none;
        }

        @media (max-width: 1100px) and (min-width: 701px) {
            :root {
                --sidebar-width: 235px;
            }

            .app-layout {
                gap: 12px;
                padding: 10px;
            }

            #sidebar {
                padding: 16px;
            }

            .brand-title {
                font-size: 0.88rem;
            }
        }

        @media (max-width: 700px) {
            html,
            body {
                width: 100%;
                min-width: 0;
                overflow-x: hidden;
            }

            body {
                background: #0b192b;
                font-size: 14px;
            }

            .bg-atmospheric {
                inset: -10px;
                filter: blur(9px) brightness(0.92) saturate(1.06);
            }

            .app-layout {
                display: block;
                width: 100%;
                min-height: 100dvh;
                padding: 0 10px;
            }

            .mobile-header {
                display: none;
            }

            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 1400;
                display: flex;
                width: min(280px, 80vw);
                min-width: 0;
                height: 100dvh;
                padding:
                    calc(20px + env(safe-area-inset-top))
                    18px
                    20px;
                overflow-y: auto;
                border-radius: 0 20px 20px 0;
                background:
                    linear-gradient(
                        145deg,
                        rgba(255, 255, 255, 0.08),
                        transparent 44%
                    ),
                    var(--glass-strong);
                box-shadow: 16px 0 45px rgba(0, 0, 0, 0.48);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                transform: translateX(-105%);
                transition: transform 230ms ease;
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #sidebar-backdrop {
                position: fixed;
                inset: 0;
                z-index: 1300;
                display: block;
                background: rgba(0, 0, 0, 0.45);
                opacity: 0;
                pointer-events: none;
                transition: opacity 180ms ease;
            }

            #sidebar-backdrop.open {
                opacity: 1;
                pointer-events: auto;
            }

            body.menu-open {
                overflow: hidden;
            }

            .brand-title {
                max-width: 210px;
                font-size: 0.98rem;
                line-height: 1.05;
            }

            #main-content {
                width: 100%;
                min-width: 0;
                padding: 12px 0 150px;
            }

            .glass-panel:hover,
            .glass-btn:hover,
            .menu-item:hover {
                border-color: inherit;
                background: inherit;
                box-shadow: inherit;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body data-module-active="mechanization" data-bg="stat">
    <div class="bg-atmospheric" aria-hidden="true">
        <div class="bg-layer bg-layer-stat"></div>
        <div class="bg-layer bg-layer-park"></div>
    </div>

    <header class="mobile-header">
        <button
            type="button"
            class="mobile-menu-icon"
            id="mobile-menu-icon-static"
            aria-label="Открыть меню"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <span class="mobile-header-title">
            Контроль•механизация
        </span>
    </header>

    <button
        type="button"
        class="menu-fab"
        id="menu-fab"
        aria-label="Открыть меню"
        aria-expanded="false"
    >
        <span class="menu-fab-icon">
            <span></span>
            <span></span>
            <span></span>
        </span>
        <span class="menu-fab-label">Меню</span>
    </button>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <div class="app-layout">
        <nav id="sidebar" class="glass-panel" aria-label="Главное меню">
            <div class="brand-box">
                <div class="brand-logo">🚜</div>

                <div class="brand-content">
                    <div class="brand-title">
                        Контроль•механизация
                    </div>

                    <div class="brand-subtitle">
                        Учет техники
                    </div>
                </div>
            </div>

            <ul class="menu-list">
                <li
                    class="menu-item"
                    onclick="navigate('dashboard', this)"
                >
                    <span>📊</span>
                    Статистика
                </li>

                <li
                    class="menu-item"
                    onclick="navigate('fleet', this)"
                >
                    <span>🚜</span>
                    Автопарк
                </li>
            </ul>

            <div class="sidebar-footer">
                <button
                    type="button"
                    class="suggestion-button"
                    onclick="openSuggestionModal()"
                >
                    💡 Оставить предложение
                </button>

                <button
                    type="button"
                    class="glass-btn auth-logout-button"
                    onclick="window.location.href='/'"
                >
                    <span>←</span>
                    Назад
                </button>
            </div>
        </nav>

        <main id="main-content"></main>
    </div>

    <footer class="app-footer">
        СХК «Великополье» · 2026 г.
    </footer>

    <div
        id="suggestion-modal"
        style="
            position: fixed;
            inset: 0;
            z-index: 11000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
        "
    >
        <div
            class="glass-panel"
            style="
                width: 100%;
                max-width: 440px;
                padding: 22px;
                max-height: calc(100dvh - 32px);
                overflow-y: auto;
            "
        >
            <div
                style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 12px;
                "
            >
                <h3
                    style="
                        margin: 0;
                        color: #fff;
                        font-size: 1.05rem;
                        font-weight: 800;
                    "
                >
                    💡 Оставить предложение
                </h3>

                <button
                    type="button"
                    onclick="closeSuggestionModal()"
                    aria-label="Закрыть"
                    style="
                        border: none;
                        background: none;
                        color: var(--muted);
                        cursor: pointer;
                        font-size: 1.35rem;
                    "
                >
                    ✕
                </button>
            </div>

            <p
                style="
                    margin: 10px 0 12px;
                    color: var(--muted);
                    font-size: 0.8rem;
                    line-height: 1.55;
                "
            >
                Заметили неудобство или есть идея,
                как улучшить приложение?
                Напишите нам — каждое предложение
                попадает напрямую к администратору.
            </p>

            <textarea
                id="suggestion-text"
                class="suggestion-textarea"
                maxlength="1000"
                placeholder="Ваше предложение..."
            ></textarea>

            <button
                type="button"
                class="glass-btn"
                id="suggestion-send-button"
                style="
                    width: 100%;
                    margin-top: 12px;
                    border-color: var(--green-dark);
                    color: var(--green);
                "
                onclick="sendSuggestion()"
            >
                ✈ Отправить
            </button>
        </div>
    </div>

    <script type="module">
        import { init as initDashboard } from './dashboard.js';
        import { init as initFleet } from './fleet.js';

        const SUPABASE_URL = "https://xoouaazntzbkjwyzggiz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_NEv4wb8ErPkNk5e8OVf-5A_XRaVFW6-";
        window._supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const modules = {
            dashboard: initDashboard,
            fleet: initFleet
        };

        let currentModule = null;

        function switchBg(moduleId) {
            document.body.dataset.bg = moduleId === 'fleet' ? 'park' : 'stat';
        }

        window.navigate = async function(moduleId, menuItem) {
            if (currentModule === moduleId) { closeMobileMenu(); return; }

            currentModule = moduleId;
            switchBg(moduleId);

            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            if (menuItem) {
                menuItem.classList.add('active');
            } else {
                const match = Array.from(document.querySelectorAll('.menu-item')).find(item =>
                    (item.getAttribute('onclick') || '').includes(`'${moduleId}'`)
                );
                if (match) match.classList.add('active');
            }

            closeMobileMenu();
            hideWelcome();

            const content = document.getElementById('main-content');
            content.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: var(--muted);">Загрузка...</div>';

            if (modules[moduleId]) {
                await modules[moduleId]();
            }
        };

        function hideWelcome() {
            const w = document.getElementById('welcome-screen');
            if (w) {
                w.classList.add('welcome-hide');
                setTimeout(() => w.remove(), 450);
            }
        }

        function setupMobileMenu() {
            const menuFab = document.getElementById('menu-fab');
            const menuIcon = document.getElementById('mobile-menu-icon-static');
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');

            const openMenu = function () {
                sidebar.classList.add('open');
                backdrop.classList.add('open');
                document.body.classList.add('menu-open');
                if (menuFab) menuFab.setAttribute('aria-expanded', 'true');
                if (menuIcon) menuIcon.setAttribute('aria-expanded', 'true');
            };

            const toggleMenu = function (event) {
                event.preventDefault();
                event.stopPropagation();
                if (event.stopImmediatePropagation) event.stopImmediatePropagation();

                const isOpen = sidebar.classList.contains('open');
                if (isOpen) {
                    closeMobileMenu();
                } else {
                    openMenu();
                }
            };

            if (menuFab) menuFab.addEventListener('click', toggleMenu);
            if (menuIcon) menuIcon.addEventListener('click', toggleMenu);

            if (backdrop) {
                backdrop.addEventListener('click', function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    closeMobileMenu();
                });
            }

            if (sidebar) {
                sidebar.addEventListener('click', function (event) {
                    event.stopPropagation();
                });
            }
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const menuIcon = document.getElementById('mobile-menu-icon-static');
            const menuFab = document.getElementById('menu-fab');

            if (sidebar) sidebar.classList.remove('open');
            if (backdrop) backdrop.classList.remove('open');
            if (document.body) document.body.classList.remove('menu-open');
            if (menuIcon) menuIcon.setAttribute('aria-expanded', 'false');
            if (menuFab) menuFab.setAttribute('aria-expanded', 'false');
        }

        window.closeMobileMenu = closeMobileMenu;

        function showSimpleMessage(title, message) {
            const modal = document.getElementById('suggestion-modal');
            if (!modal) { alert(message); return; }
            closeSuggestionModal();
            setTimeout(() => { alert(title + '\n\n' + message); }, 120);
        }
        window.showSimpleMessage = showSimpleMessage;

        window.openSuggestionModal = function () {
            const modal = document.getElementById('suggestion-modal');
            if (!modal) return;
            modal.style.display = 'flex';
            const textarea = document.getElementById('suggestion-text');
            if (textarea) {
                textarea.value = '';
                setTimeout(() => textarea.focus(), 60);
            }
        };

        window.closeSuggestionModal = function () {
            const modal = document.getElementById('suggestion-modal');
            if (modal) modal.style.display = 'none';
        };

        window.sendSuggestion = async function () {
            const textarea = document.getElementById('suggestion-text');
            const sendButton = document.getElementById('suggestion-send-button');
            const text = String(textarea ? textarea.value : '').trim();

            if (text.length < 3) {
                window.showSimpleMessage('Пустое предложение', 'Опишите вашу идею подробнее — минимум 3 символа.');
                return;
            }

            if (sendButton) sendButton.disabled = true;

            try {
                let user = null;
                try {
                    if (window.AuthModule && window.AuthModule.session) {
                        user = window.AuthModule.session.user;
                    }
                } catch (e) { user = null; }

                if (!user) {
                    try {
                        const data = await window._supabase.auth.getUser();
                        user = data && data.user && data.user.id ? data.user : null;
                    } catch (e) { user = null; }
                }

                let authorName = 'Неизвестный';
                if (user) {
                    try {
                        const { data: prof } = await window._supabase
                            .from('user_profiles')
                            .select('full_name')
                            .eq('id', user.id)
                            .maybeSingle();
                        authorName = (prof && prof.full_name) || (user.user_metadata || {}).full_name || user.email || 'Неизвестный';
                    } catch (e) {
                        authorName = (user.user_metadata || {}).full_name || user.email || 'Неизвестный';
                    }
                } else {
                    try {
                        const stored = JSON.parse(localStorage.getItem('velpol_user'));
                        if (stored) authorName = stored.full_name || stored.email || 'Неизвестный';
                    } catch (e) { /* ignore */ }
                }

                const { error } = await window._supabase
                    .from('suggestions')
                    .insert({
                        text: text,
                        user_id: user ? user.id : null,
                        user_name: authorName,
                        page: 'mechanization'
                    });

                if (error) throw error;

                window.closeSuggestionModal();
                window.showSimpleMessage('Спасибо!', 'Ваше предложение отправлено администратору.');
            } catch (error) {
                console.error('Suggestion error:', error);
                window.showSimpleMessage('Ошибка', 'Не удалось отправить предложение. Попробуйте позже.');
            } finally {
                if (sendButton) sendButton.disabled = false;
            }
        };

        async function checkMechAccess() {
            let user = null;
            try {
                const { data } = await window._supabase.auth.getUser();
                user = data && data.user ? data.user : null;
            } catch (e) { user = null; }

            if (!user) {
                window.location.href = '../index.html';
                return false;
            }

            try {
                const { data: access } = await window._supabase
                    .from('module_access')
                    .select('module_name, has_access')
                    .eq('user_id', user.id)
                    .eq('has_access', true);

                const list = access || [];
                const isAdmin = list.some(a => a.module_name === 'admin');
                const hasMech = isAdmin || list.some(a => a.module_name === 'mechanization');

                if (!hasMech) {
                    alert('У вас нет доступа к модулю «Механизация». Обратитесь к администратору.');
                    await window._supabase.auth.signOut();
                    window.location.href = '../index.html';
                    return false;
                }

                window._mechUser = user;
                window._mechIsAdmin = isAdmin;
                return true;
            } catch (e) {
                console.error('Access check error:', e);
                window.location.href = '../index.html';
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await checkMechAccess();
            if (!ok) return;
            setupMobileMenu();
            renderWelcome();
            setTimeout(() => {
                document.body.classList.add('app-booted');
            }, 500);
        });

        async function renderWelcome() {
            let name = '';
            try {
                const stored = JSON.parse(localStorage.getItem('velpol_user') || 'null');
                if (stored) name = stored.full_name || stored.email || '';
            } catch (e) { /* ignore */ }

            try {
                const { data } = await window._supabase.auth.getUser();
                if (data && data.user) {
                    const meta = data.user.user_metadata || {};
                    name = meta.full_name || '';
                    if (!name || name === data.user.email) {
                        try {
                            const { data: prof } = await window._supabase
                                .from('user_profiles')
                                .select('full_name')
                                .eq('id', data.user.id)
                                .maybeSingle();
                            if (prof && prof.full_name) name = prof.full_name;
                        } catch (e) { /* ignore */ }
                    }
                    if (!name) name = data.user.email || '';
                }
            } catch (e) { /* ignore */ }

            const fullName = String(name).trim() || 'гость';
            const hour = new Date().getHours();
            const dayPart = hour < 5 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';

            const content = document.getElementById('main-content');
            if (!content) return;
            content.innerHTML = `
                <div id="welcome-screen" class="welcome-screen">
                    <div class="welcome-card">
                        <div class="welcome-logo">🚜</div>
                        <h1 class="welcome-title">${dayPart}, ${fullName}!</h1>
                        <p class="welcome-sub">Добро пожаловать в «Механизацию» — учёт техники и планирование работ.</p>
                        <div class="welcome-hint">
                            <span class="welcome-hint-icon">☰</span>
                            <span>Нажмите <b>«Меню»</b>, чтобы начать</span>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
