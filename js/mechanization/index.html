<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b1728">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Контроль•механизация</title>

    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../../assets/icon.svg">
    <link rel="apple-touch-icon" href="../../assets/icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            color-scheme: dark;

            --page-bg: #091728;
            --page-bg-deep: #060e1b;

            --glass: rgba(20, 39, 64, 0.44);
            --glass-strong: rgba(14, 30, 51, 0.96);
            --input-bg: rgba(3, 10, 20, 0.58);

            --line: rgba(255, 255, 255, 0.15);
            --line-bright: rgba(255, 255, 255, 0.28);
            --line-green: rgba(52, 211, 153, 0.48);

            --text: #f5f7fb;
            --muted: #a8b6c9;
            --subtle: #78879b;

            --green: #34d399;
            --green-dark: #10b981;
            --blue: #7dd3fc;
            --amber: #fbbf24;
            --red: #fb7185;

            --card-radius: 20px;
            --sidebar-width: 280px;

            --shadow:
                0 16px 44px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: clip;
            background: var(--page-bg-deep);
        }

        body {
            position: relative;
            isolation: isolate;
            width: 100%;
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow-x: clip;
            color: var(--text);
            background: var(--page-bg);
            font-family: "Exo 2", sans-serif;
            font-size: 15px;
            line-height: 1.4;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            color: inherit;
        }

        .bg-atmospheric {
            position: fixed;
            inset: -24px;
            z-index: -3;
            pointer-events: none;
            background:
                linear-gradient(
                    180deg,
                    #0a1930,
                    #060e1b
                );
            filter: blur(14px) brightness(0.9) saturate(1.08);
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 900ms ease;
        }

        .bg-layer-mech {
            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 31, 0.1),
                    rgba(4, 11, 22, 0.3)
                ),
                url("../../assets/bg_farm_dash.jpg") center center / cover no-repeat;
        }

        body[data-bg="mech"] .bg-layer-mech {
            opacity: 1;
        }

        .bg-atmospheric::after {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(5, 13, 25, 0.1) 0%,
                    rgba(5, 14, 27, 0.06) 45%,
                    rgba(3, 9, 18, 0.34) 100%
                ),
                radial-gradient(
                    ellipse at center,
                    rgba(8, 20, 36, 0.02),
                    rgba(3, 8, 16, 0.26)
                );
            content: "";
        }

        .app-layout {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 20px;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 14px;
        }

        .glass-panel {
            position: relative;
            min-width: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top-color: rgba(255, 255, 255, 0.26);
            border-radius: var(--card-radius);
            background:
                linear-gradient(
                    150deg,
                    rgba(255, 255, 255, 0.1),
                    rgba(255, 255, 255, 0.025) 42%,
                    transparent
                ),
                var(--glass);
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter:
                blur(20px) saturate(140%);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        #sidebar {
            position: sticky;
            top: 14px;
            z-index: 100;
            align-self: flex-start;
            display: flex;
            flex: 0 0 var(--sidebar-width);
            flex-direction: column;
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: calc(100vh - 28px);
            height: calc(100dvh - 28px);
            padding: 20px;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.09),
                    transparent 44%
                ),
                rgba(14, 30, 51, 0.78);
        }

        .brand-box {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            width: 100%;
            min-width: 0;
            margin-bottom: 20px;
            padding-bottom: 17px;
            border-bottom: 1px solid var(--line);
        }

        .brand-logo {
            display: flex;
            flex: 0 0 42px;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            background: linear-gradient(135deg, #34d399, #047857);
            box-shadow:
                0 8px 24px rgba(16, 185, 129, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
        }

        .brand-content {
            flex: 1 1 auto;
            min-width: 0;
            padding-top: 1px;
        }

        .brand-title {
            display: block;
            width: 100%;
            max-width: 175px;
            overflow-wrap: anywhere;
            color: #fff;
            font-size: 0.98rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.035em;
        }

        .brand-subtitle {
            display: block;
            margin-top: 5px;
            color: var(--green);
            font-size: 0.64rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            flex: 0 1 auto;
            gap: 5px;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .sidebar-footer {
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .sidebar-footer .auth-logout-button {
            width: 100%;
            min-height: 42px;
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 46px;
            padding: 9px 12px;
            border: 1px solid transparent;
            border-radius: 14px;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 600;
            overflow: hidden;
            transition:
                color 180ms ease,
                background-color 180ms ease,
                border-color 180ms ease,
                transform 180ms ease,
                box-shadow 180ms ease;
        }

        .menu-item > span:first-child {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            transition:
                background-color 180ms ease,
                border-color 180ms ease,
                transform 220ms ease;
        }

        .menu-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateX(3px);
        }

        .menu-item:hover > span:first-child {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.06) rotate(-4deg);
        }

        .menu-item.active {
            border-color: transparent;
            color: #fff;
            background:
                linear-gradient(
                    135deg,
                    rgba(16, 185, 129, 0.22),
                    rgba(52, 211, 153, 0.06)
                ),
                rgba(9, 22, 39, 0.4);
            box-shadow:
                0 10px 26px rgba(16, 185, 129, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .menu-item.active > span:first-child {
            border-color: rgba(52, 211, 153, 0.55);
            background: linear-gradient(
                135deg,
                #34d399,
                #047857
            );
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        .menu-item.active::before {
            position: absolute;
            top: 14%;
            bottom: 14%;
            left: 0;
            width: 3px;
            border-radius: 0 4px 4px 0;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
            content: "";
        }

        .menu-item.active::after {
            position: absolute;
            top: 0;
            right: -60px;
            width: 44px;
            height: 100%;
            background: radial-gradient(
                ellipse,
                rgba(52, 211, 153, 0.14),
                transparent 70%
            );
            content: "";
        }

        .app-footer {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 0;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            color: var(--subtle);
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }

        #main-content {
            flex: 1 1 auto;
            width: 100%;
            min-width: 0;
            padding-bottom: 150px;
            animation: none !important;
            transition: none !important;
        }

        #main-content.module-loading,
        #main-content.module-loaded {
            opacity: 1 !important;
            animation: none !important;
            transition: none !important;
        }

        .mobile-header {
            display: none;
        }

        .mobile-menu-icon {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 42px;
            min-height: 42px;
            padding: 0;
            border: 1px solid var(--line-bright);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            cursor: pointer;
            transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
        }

        .mobile-menu-icon span {
            display: block;
            width: 20px;
            height: 2px;
            border-radius: 2px;
            background: #fff;
            transition: transform 240ms ease, opacity 180ms ease;
        }

        .mobile-menu-icon[aria-expanded="true"] {
            border-color: var(--line-green);
            background: rgba(16, 185, 129, 0.18);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .mobile-menu-icon[aria-expanded="true"] span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .mobile-menu-icon:active {
            transform: scale(0.94);
        }

        @keyframes panel-in {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body:not(.app-booted) .glass-panel,
        body:not(.app-booted) .stat-card {
            animation: panel-in 320ms ease both;
        }

        body:not(.app-booted) #main-content > div:first-child > .stat-card,
        body:not(.app-booted) #main-content > div:first-child > .glass-panel {
            animation-delay: 40ms;
        }

        .menu-btn {
            min-height: 38px;
            padding: 7px 12px;
            border: 1px solid var(--line-bright);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .glass-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 40px;
            padding: 9px 14px;
            border: 1px solid var(--line-bright);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition:
                border-color 160ms ease,
                background-color 160ms ease,
                box-shadow 160ms ease,
                transform 160ms ease;
        }

        .glass-btn:hover {
            border-color: rgba(255, 255, 255, 0.32);
            background: rgba(255, 255, 255, 0.12);
        }

        .glass-btn:active {
            transform: scale(0.97);
        }

        .glass-btn:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        #sidebar-backdrop {
            display: none;
        }

        @media (max-width: 1100px) and (min-width: 701px) {
            :root {
                --sidebar-width: 235px;
            }

            .app-layout {
                gap: 12px;
                padding: 10px;
            }

            #sidebar {
                padding: 16px;
            }

            .brand-title {
                font-size: 0.88rem;
            }
        }

        @media (max-width: 700px) {
            html,
            body {
                width: 100%;
                min-width: 0;
                overflow-x: hidden;
            }

            body {
                background: #0b192b;
                font-size: 14px;
            }

            .bg-atmospheric {
                inset: -10px;
                filter: blur(9px) brightness(0.92) saturate(1.06);
            }

            .app-layout {
                display: block;
                width: 100%;
                min-height: 100dvh;
                padding: 0 10px;
            }

            .mobile-header {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 1200;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                width: 100%;
                min-height: calc(54px + env(safe-area-inset-top));
                padding:
                    env(safe-area-inset-top)
                    12px
                    0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                background: rgba(11, 24, 42, 0.42);
                backdrop-filter: blur(16px) saturate(1.2);
                -webkit-backdrop-filter: blur(16px) saturate(1.2);
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
            }

            .mobile-header .mobile-header-title {
                overflow: hidden;
                color: #ffffff;
                font-size: 0.86rem;
                font-weight: 800;
                letter-spacing: -0.01em;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 1400;
                display: flex;
                width: min(300px, 88vw);
                min-width: 0;
                height: 100dvh;
                padding:
                    calc(20px + env(safe-area-inset-top))
                    18px
                    20px;
                overflow-y: auto;
                border-radius: 0 20px 20px 0;
                background:
                    linear-gradient(
                        145deg,
                        rgba(255, 255, 255, 0.08),
                        transparent 44%
                    ),
                    var(--glass-strong);
                box-shadow: 16px 0 45px rgba(0, 0, 0, 0.48);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                transform: translateX(-105%);
                transition: transform 230ms ease;
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #sidebar-backdrop {
                position: fixed;
                inset: 0;
                z-index: 1300;
                display: block;
                background: rgba(0, 0, 0, 0.58);
                opacity: 0;
                pointer-events: none;
                transition: opacity 180ms ease;
            }

            #sidebar-backdrop.open {
                opacity: 1;
                pointer-events: auto;
            }

            body.menu-open {
                overflow: hidden;
            }

            .brand-title {
                max-width: 210px;
                font-size: 0.98rem;
                line-height: 1.05;
            }

            .mobile-header .menu-btn {
                position: relative;
                z-index: 1500;
            }

            #main-content {
                width: 100%;
                min-width: 0;
                margin-top: calc(54px + env(safe-area-inset-top));
                padding: 12px 0 150px;
            }

            .glass-panel:hover,
            .glass-btn:hover,
            .menu-item:hover {
                border-color: inherit;
                background: inherit;
                box-shadow: inherit;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body data-module-active="mechanization" data-bg="mech">
    <div class="bg-atmospheric" aria-hidden="true">
        <div class="bg-layer bg-layer-mech"></div>
    </div>

    <header class="mobile-header">
        <button
            type="button"
            class="mobile-menu-icon"
            id="mobile-menu-icon-static"
            aria-label="Открыть меню"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <span class="mobile-header-title">
            Контроль•механизация
        </span>
    </header>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <div class="app-layout">
        <nav id="sidebar" class="glass-panel" aria-label="Главное меню">
            <div class="brand-box">
                <div class="brand-logo">🚜</div>

                <div class="brand-content">
                    <div class="brand-title">
                        Контроль•механизация
                    </div>

                    <div class="brand-subtitle">
                        Учет техники
                    </div>
                </div>
            </div>

            <ul class="menu-list">
                <li
                    class="menu-item active"
                    onclick="navigate('dashboard', this)"
                >
                    <span>📊</span>
                    Статистика
                </li>

                <li
                    class="menu-item"
                    onclick="navigate('fleet', this)"
                >
                    <span>🚜</span>
                    Автопарк
                </li>
            </ul>

            <div class="sidebar-footer">
                <button
                    type="button"
                    class="glass-btn auth-logout-button"
                    onclick="window.location.href='/'"
                >
                    <span>←</span>
                    Назад
                </button>
            </div>
        </nav>

        <main id="main-content"></main>
    </div>

    <footer class="app-footer">
        СХК «Великополье» · 2026 г.
    </footer>

    <script type="module">
        import { init as initDashboard } from './dashboard.js';
        import { init as initFleet } from './fleet.js';

        const SUPABASE_URL = "https://eaiitxfoqlkmykyqqapg.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3sU4_opgqfZ5tPzk1bW5Ig_6XlX97pm";
        window._supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const modules = {
            dashboard: initDashboard,
            fleet: initFleet
        };

        let currentModule = 'dashboard';

        window.navigate = async function(moduleId, menuItem) {
            if (currentModule === moduleId) return;
            
            currentModule = moduleId;
            
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            if (menuItem) {
                menuItem.classList.add('active');
            }

            closeMobileMenu();

            const content = document.getElementById('main-content');
            content.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: var(--muted);">Загрузка...</div>';

            if (modules[moduleId]) {
                await modules[moduleId]();
            }
        };

        function setupMobileMenu() {
            const menuIcon = document.getElementById('mobile-menu-icon-static');
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');

            if (menuIcon && sidebar && backdrop) {
                menuIcon.addEventListener('click', () => {
                    const isOpen = sidebar.classList.contains('open');
                    if (isOpen) {
                        closeMobileMenu();
                    } else {
                        sidebar.classList.add('open');
                        backdrop.classList.add('open');
                        document.body.classList.add('menu-open');
                        menuIcon.setAttribute('aria-expanded', 'true');
                    }
                });

                backdrop.addEventListener('click', closeMobileMenu);
            }
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const menuIcon = document.getElementById('mobile-menu-icon-static');

            if (sidebar) sidebar.classList.remove('open');
            if (backdrop) backdrop.classList.remove('open');
            if (document.body) document.body.classList.remove('menu-open');
            if (menuIcon) menuIcon.setAttribute('aria-expanded', 'false');
        }

        window.closeMobileMenu = closeMobileMenu;

        document.addEventListener('DOMContentLoaded', async () => {
            setupMobileMenu();
            await navigate('dashboard');
            setTimeout(() => {
                document.body.classList.add('app-booted');
            }, 500);
        });
    </script>
</body>
</html>
